[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecm2027-sim-track"
version = "0.1.0"
description = "Singapore Embodied AI Challenge for Manufacturing simulation track"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gymnasium>=1.2,<2",
  "numpy>=2",
  "scipy",
  "PyYAML",
  "h5py",
  "termcolor",
  "tqdm",
  "pandas",
  "requests",
  "lazy-import",
  "pynput",
  "vuer",
  "pyzmq",
  "Flask",
  "mediapy",
  "opencv-python",
  "trimesh",
  "psutil",
  "appdirs",
  "packaging",
]

[project.optional-dependencies]
lerobot = ["lerobot==0.5.1", "pyserial>=3.5", "deepdiff>=7,<9", "feetech-servo-sdk>=1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["robofinals*", "robofinals_tasks*", "policy*"]
namespaces = true

[project.entry-points.robofinals_modules]
robofinals_scenes = "robofinals.modules.scenes"
robofinals_robots = "robofinals.modules.robots.galbot"
robofinals_tasks = "robofinals_tasks"
